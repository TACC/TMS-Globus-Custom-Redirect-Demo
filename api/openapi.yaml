openapi: 3.1.0
info:
  title: Approved Institutions API
  version: 0.7.0
  summary: The institutions a user can sign in through, and the IdP each one steers to.
  description: |
    Read-only endpoints: the list of approved institutions a user can sign
    in through, with the IdP each one steers to, and the JSON-LD contexts
    that map that list to schema.org. The list also answers CORS preflight
    requests.

    The list comes in an envelope, `{ type, status, message, version, result }`.
    Its entries come from the deployment's institution data: every entry
    an operator has approved for sign-in, and no other.

    ### Versions
    `v1` in the paths is the API's major version, which changes only with an
    incompatible change. `info.version` versions this document and stays
    below 1.0.0 until the v1 contract is frozen: until then a minor version
    may still change it incompatibly. From 1.0.0 on, minor versions only add
    to it.

    ### Compatibility
    Later versions may add fields to any object, and values to `provider`
    (see `Provider`). Clients must ignore fields they do not recognise.

    ### Requests
    - `HEAD` gets the same status and headers as `GET`, without a body.
    - Query parameters are ignored.
    - `Accept` is ignored: the list is always `application/json` and a
      context always `application/ld+json`, never `406`.

    ### Conditional requests
    Preconditions are evaluated as RFC 9110 §13.2.2 orders them, `If-Match`
    first, then `If-None-Match`, and only once the data can be read: when
    it cannot, the error is sent whatever they say.

    - Entity tags here are weak, so `If-Match`, which compares strongly,
      succeeds only for `*`. Any other value gets `412 Precondition Failed`.
    - `If-None-Match` is `*`, or a comma-separated list of entity tags. `*`
      matches whenever the resource can be served; it is valid only as the
      whole field, so a list member `*` is not an entity tag. A tag matches
      when it equals the response's `ETag` by weak comparison: the `W/`
      prefix is ignored on both sides and the quoted parts are compared
      byte for byte. Members that are not entity tags match nothing, and
      the rest of the list still counts. A match gets `304 Not Modified`.
    - The contexts have no `ETag`, so for them only `If-None-Match: *`
      matches.
    - There is no `Last-Modified` and no range support, so
      `If-Modified-Since`, `If-Unmodified-Since` and `If-Range` are
      ignored.

    ### Header values
    Where a header's value is a comma-separated list (`Allow`, `Vary`, the
    `Access-Control-*` lists), its members may come in any order, and header
    names in it are case-insensitive; the `const` gives the members. A
    `Cache-Control` value gives directives the response carries; a
    deployment may add others that do not contradict them.

    ### Linked data
    The payload stays plain JSON. Each schema and field names the
    linked-data term it means with `x-schema-org`, and the JSON-LD context
    holds the same mapping. `schema-org.md`, next to this document, explains
    the choice of terms.

    ### Errors
    Errors are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
    details (`application/problem+json`, the `Problem` schema), sent with
    `Cache-Control: no-store`. Besides the errors each operation lists:

    - A method a path does not support gets `405 Method Not Allowed`, with
      an `Allow` header naming the methods it does support:
      `GET, HEAD, OPTIONS` for `/api/v1/institutions`, `GET, HEAD` for a
      context.
    - Any other path under `/api/v1`, and `/api/v1` itself, gets
      `404 Not Found`. `/api/v1/institutions/` (with a trailing slash) is
      such a path.

    On `/api/v1/institutions` errors carry the list's CORS headers, like
    every response there. Everywhere else they carry
    `Access-Control-Allow-Origin: *`, like the contexts.
  contact:
    name: TACC
    url: https://tacc.utexas.edu
  license:
    name: Proprietary

servers:
  - url: "{base_url}"
    description: Any deployment of this API.
    variables:
      base_url:
        default: https://tms.example.org
        description: Base URL of the deployment, with no trailing slash.

# Public: the list holds no secrets, and clients read it before sign-in.
security:
  - {}

tags:
  - name: institutions
    description: Approved-institution list

paths:
  /api/v1/institutions:
    get:
      tags: [institutions]
      operationId: listInstitutions
      summary: List the approved institutions with their IdP data
      description: |
        Returns approved entries only, in a stable order the server
        chooses: the same on every request while `version` stays the same.
        The list is public, so unapproved entries (for example, ones pending
        review) never appear in it.

        **Caching.** Clients revalidate on every use (`Cache-Control: no-cache`).
        When the data has a `version`, the response's `ETag` is the weak tag
        `W/"<version>;r<n>"`, where `n` is the context revision `Link` names,
        so the tag changes when either the data or its context does. It is
        weak because it names revisions, not the exact bytes: the same data
        may be sent with other bytes (field order, white space, a reworded
        `message`). See *Conditional requests* above for `If-None-Match` and
        `If-Match`.

        A `304` carries `Cache-Control`, `ETag`, `Vary` and the CORS headers,
        as a `200` would, and no body, `Content-Type` or `Link`.

        **CORS.** Cross-origin reads are set per deployment by a list of
        allowed origins (`scheme://host[:port]`), which is either empty,
        specific origins, or `*` for any origin. Every response, including
        `304` and errors, follows it:

        - **Empty** (only clients on the same origin): no CORS headers.
        - **Specific origins**: always `Vary: Origin`. When the request's
          `Origin` exactly matches a listed origin, also
          `Access-Control-Allow-Origin` set to that origin and
          `Access-Control-Expose-Headers: ETag, Link, Retry-After`. Other
          origins get no `Access-Control-*` headers.
        - **`*`**: `Access-Control-Allow-Origin: *` and
          `Access-Control-Expose-Headers: ETag, Link, Retry-After` on every
          response.

        The list is public, so credentials are never allowed
        (`Access-Control-Allow-Credentials` is never sent). A cross-origin
        `GET` that sets `If-None-Match` itself is preceded by a preflight,
        which `OPTIONS` answers.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: The approved institutions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
            Link:
              $ref: "#/components/headers/ContextLink"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionsResponse"
              examples:
                approved:
                  summary: An abridged list
                  value:
                    type: ItemList
                    status: success
                    message: Approved institutions.
                    version: "2026-10-23.1"
                    result:
                      - type: Organization
                        id: globus
                        name: Globus (default login, no redirect)
                        provider: globus
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
                      - type: Organization
                        id: uchicago
                        name: University of Chicago
                        provider: globus
                        redirect_idp_domain: uchicago.edu
                        idp_logout_url: https://uchicago.okta.com/login/signout
                        approved: true
                      - type: Organization
                        id: tacc_tapis
                        name: Tapis OAuth2 (TaccTapis)
                        provider: tacc_tapis
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
        "304":
          $ref: "#/components/responses/ListNotModified"
        "412":
          $ref: "#/components/responses/ListPreconditionFailed"
        "500":
          $ref: "#/components/responses/DataInvalid"
        "503":
          $ref: "#/components/responses/DataUnavailable"
    head:
      tags: [institutions]
      operationId: headInstitutions
      summary: The list's status and headers, without the body
      description: As `GET`, without a body.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: The headers `GET` would send with the list.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
            Link:
              $ref: "#/components/headers/ContextLink"
        "304":
          $ref: "#/components/responses/ListNotModified"
        "412":
          description: As for `GET`, without the body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ErrorCacheControl"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
        "500":
          description: As for `GET`, without the body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ErrorCacheControl"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
        "503":
          description: As for `GET`, without the body.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Cache-Control:
              $ref: "#/components/headers/ErrorCacheControl"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
    options:
      tags: [institutions]
      operationId: preflightInstitutions
      summary: CORS preflight for the institutions list
      description: |
        Answers the preflight a browser sends before a cross-origin `GET`
        that sets `If-None-Match`, by the same list of allowed origins as
        `GET`:

        - **Empty**: no CORS headers, so the browser blocks the `GET`.
        - **Specific origins**: always `Vary: Origin`. A listed `Origin` also
          gets `Access-Control-Allow-Origin` set to that origin and the
          `Access-Control-Allow-*` and `Access-Control-Max-Age` headers
          below; other origins get no `Access-Control-*` headers.
        - **`*`**: `Access-Control-Allow-Origin: *` and the headers below.

        The allowed method and header are fixed. The server need not check
        `Access-Control-Request-Method` or `Access-Control-Request-Headers`:
        the browser compares them against what the response allows.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: Access-Control-Request-Method
          in: header
          required: false
          description: Method of the request being preflighted.
          schema:
            type: string
          example: GET
        - name: Access-Control-Request-Headers
          in: header
          required: false
          description: Non-safelisted headers the request will set.
          schema:
            type: string
          example: if-none-match
      responses:
        "204":
          description: The preflight answer; no body.
          headers:
            Allow:
              description: Methods the list supports.
              required: true
              schema:
                const: GET, HEAD, OPTIONS
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Allow-Methods:
              description: Sent exactly when `Access-Control-Allow-Origin` is.
              schema:
                const: GET
            Access-Control-Allow-Headers:
              description: Sent exactly when `Access-Control-Allow-Origin` is.
              schema:
                const: If-None-Match
            Access-Control-Max-Age:
              description: |
                Seconds the browser may reuse this answer. Sent exactly when
                `Access-Control-Allow-Origin` is.
              schema:
                const: 7200
            Vary:
              $ref: "#/components/headers/VaryOrigin"

  /api/v1/institutions.context.r{revision}.jsonld:
    get:
      tags: [institutions]
      operationId: getInstitutionsContext
      summary: A revision of the JSON-LD context for the institutions list
      description: |
        Maps the list's plain JSON fields to schema.org and `tms:` terms.
        Public and open to any origin (`Access-Control-Allow-Origin: *`), so
        JSON-LD processors on other sites can fetch it.

        Contexts are revised separately from the API. Each revision is one
        fixed document: a changed context (for example, mapping a field or
        `provider` value a later version adds) is published as the next
        revision, and the list's `Link` header moves to it. Earlier
        revisions stay served unchanged for clients that cached a `Link` to
        them. A revision's URL never changes content, so it may be cached
        indefinitely.

        Each revision is served byte for byte as the file
        `institutions.context.r<n>.jsonld` next to this document, whose
        SHA-256 `x-context-sha256` gives. The example below is the latest
        revision.
      x-context-sha256:
        "1": 0c053922807aef6eb421cffc9fe70b6dc266886907109972530d2d44a6851f93
        "2": 615ed222b4642a186c6bd17d4dbbe895cc10c33fbab6f08ca672b917989b14b0
      parameters:
        - $ref: "#/components/parameters/Revision"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The JSON-LD context document.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
            Cache-Control:
              $ref: "#/components/headers/ContextCacheControl"
          content:
            application/ld+json:
              schema:
                type: object
                required: ["@context"]
                properties:
                  "@context":
                    type: object
              examples:
                latest:
                  summary: Revision 2
                  value:
                    "@context":
                      schema: https://schema.org/
                      tms: https://tacc.utexas.edu/ns/tms#
                      type: "@type"
                      ItemList: schema:ItemList
                      Organization: schema:Organization
                      status: null
                      message: null
                      version: null
                      result: schema:itemListElement
                      id: schema:identifier
                      name: schema:name
                      provider:
                        "@id": tms:provider
                        "@type": "@vocab"
                      redirect_idp_domain: tms:redirectIdpDomain
                      idp_logout_url:
                        "@id": tms:idpLogoutUrl
                        "@type": "@id"
                      approved: tms:approved
                      globus: tms:GlobusProvider
                      tacc_tapis: tms:TaccTapisProvider
        "304":
          $ref: "#/components/responses/ContextNotModified"
        "404":
          $ref: "#/components/responses/NoSuchRevision"
        "412":
          $ref: "#/components/responses/ContextPreconditionFailed"
    head:
      tags: [institutions]
      operationId: headInstitutionsContext
      summary: A context revision's status and headers, without the body
      description: As `GET`, without a body.
      parameters:
        - $ref: "#/components/parameters/Revision"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The headers `GET` would send with the context.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
            Cache-Control:
              $ref: "#/components/headers/ContextCacheControl"
        "304":
          $ref: "#/components/responses/ContextNotModified"
        "404":
          description: As for `GET`, without the body.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
            Cache-Control:
              $ref: "#/components/headers/ErrorCacheControl"
        "412":
          description: As for `GET`, without the body.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
            Cache-Control:
              $ref: "#/components/headers/ErrorCacheControl"

components:
  parameters:
    Origin:
      name: Origin
      in: header
      required: false
      description: Origin of the page making a cross-origin request.
      schema:
        type: string
      example: https://portal.example.org
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Entity tags from earlier responses, or `*`.
      schema:
        type: string
      example: W/"2026-10-23.1;r2"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Succeeds only as `*`; anything else gets `412`.
      schema:
        type: string
      example: "*"
    Revision:
      name: revision
      in: path
      required: true
      description: |
        A published revision, in decimal without leading zeros. Any other
        value gets `404`.
      schema:
        type: string
        enum: ["1", "2"]
      example: "2"

  headers:
    ListCacheControl:
      description: Clients must revalidate before reusing a stored copy.
      required: true
      schema:
        const: no-cache
    ContextCacheControl:
      description: A revision never changes, so it may be kept indefinitely.
      required: true
      schema:
        const: public, max-age=31536000, immutable
    ErrorCacheControl:
      description: Errors are never stored.
      required: true
      schema:
        const: no-store
    ETag:
      description: |
        The weak tag `W/"<version>;r<n>"`, `n` being the context revision
        the list's `Link` names. Present exactly when the data has a
        `version`.
      schema:
        type: string
        pattern: '^W/"[-!#-+.-~]{1,64};r[1-9][0-9]*"$'
      example: W/"2026-10-23.1;r2"
    ContextLink:
      description: |
        Points JSON-LD processors at the latest context, as an absolute URL:
        `<{base_url}/api/v1/institutions.context.r2.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"`.
      required: true
      schema:
        type: string
      example: <https://tms.example.org/api/v1/institutions.context.r2.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"
    CorsAllowOrigin:
      description: |
        The request's `Origin` when the deployment allows it, or `*` when it
        allows any origin. Absent otherwise.
      schema:
        type: string
      example: https://portal.example.org
    CorsExposeHeaders:
      description: |
        Lets cross-origin scripts read the `ETag`, `Link` and `Retry-After`
        headers. Sent exactly when `Access-Control-Allow-Origin` is.
      schema:
        const: ETag, Link, Retry-After
    VaryOrigin:
      description: |
        Sent when the deployment allows specific origins, since the CORS
        headers then depend on the request's `Origin`.
      schema:
        const: Origin
    AnyOrigin:
      description: Any origin may read the response.
      required: true
      schema:
        const: "*"
    RetryAfter:
      description: Seconds to wait before retrying. Optional.
      schema:
        type: integer
        minimum: 0

  responses:
    ListNotModified:
      description: |
        `If-None-Match` matched. No body, `Content-Type` or `Link`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ListCacheControl"
        ETag:
          $ref: "#/components/headers/ETag"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/CorsAllowOrigin"
        Access-Control-Expose-Headers:
          $ref: "#/components/headers/CorsExposeHeaders"
        Vary:
          $ref: "#/components/headers/VaryOrigin"
    ListPreconditionFailed:
      description: |
        `If-Match` was something other than `*`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/CorsAllowOrigin"
        Access-Control-Expose-Headers:
          $ref: "#/components/headers/CorsExposeHeaders"
        Vary:
          $ref: "#/components/headers/VaryOrigin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            failed:
              summary: A failed If-Match
              value:
                type: about:blank
                title: Precondition Failed
                status: 412
                detail: If-Match did not match.
    DataInvalid:
      description: |
        The institution data was read but is invalid, so none of it is
        served.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/CorsAllowOrigin"
        Access-Control-Expose-Headers:
          $ref: "#/components/headers/CorsExposeHeaders"
        Vary:
          $ref: "#/components/headers/VaryOrigin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              summary: Invalid institution data
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: The institution data is invalid.
    DataUnavailable:
      description: |
        The institution data could not be read for now; the client may
        retry later.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/CorsAllowOrigin"
        Access-Control-Expose-Headers:
          $ref: "#/components/headers/CorsExposeHeaders"
        Vary:
          $ref: "#/components/headers/VaryOrigin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              summary: Unreachable institution data
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The institution data cannot be read right now.
    ContextNotModified:
      description: |
        `If-None-Match: *` matched. No body or `Content-Type`.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/AnyOrigin"
        Cache-Control:
          $ref: "#/components/headers/ContextCacheControl"
    NoSuchRevision:
      description: No such revision has been published.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/AnyOrigin"
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknown:
              summary: An unpublished revision
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: No such resource.
    ContextPreconditionFailed:
      description: |
        `If-Match` was something other than `*`.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/AnyOrigin"
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    InstitutionsResponse:
      type: object
      description: |
        Envelope around the institution list. Clients must ignore fields
        they do not recognise.
      x-schema-org:
        "@type": schema:ItemList
      required: [type, status, message, result]
      properties:
        type:
          const: ItemList
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        status:
          const: success
        message:
          type: string
          description: Human-readable summary of the response.
        version:
          type: string
          description: |
            Revision of the institution data (not of this API), so a client can
            tell when the list has changed. The server MUST give the data a
            new `version` whenever anything in `result` changes. Opaque; it is
            also inside the response's `ETag`, so it is limited to visible
            ASCII other than `"` (not allowed in an `ETag`) and `,` (which
            separates tags in `If-None-Match`). Optional; readers must not
            require it.
          minLength: 1
          maxLength: 64
          pattern: "^[-!#-+.-~]+$"
          examples: ["2026-10-23.1"]
        result:
          type: array
          description: |
            The approved institutions, in the server's stable order. Each
            `id` appears at most once; the server must enforce this, since
            JSON Schema cannot.
          items:
            $ref: "#/components/schemas/Institution"
          x-schema-org: schema:itemListElement

    Institution:
      type: object
      x-schema-org:
        "@type": schema:Organization
      description: |
        An organization users can sign in through. Responses always include
        every field, writing `null` where a field does not apply. Clients must
        ignore fields they do not recognise.
      required: [type, id, name, provider, redirect_idp_domain, idp_logout_url, approved]
      # A tacc_tapis entry never has an IdP domain.
      if:
        properties:
          provider:
            const: tacc_tapis
      then:
        properties:
          redirect_idp_domain:
            type: "null"
      properties:
        type:
          const: Organization
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        id:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9_]+$"
