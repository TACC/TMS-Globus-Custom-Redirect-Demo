openapi: 3.1.0
info:
  title: Approved Institutions API
  version: 0.6.0
  summary: The institutions a user can sign in through, and the IdP each one steers to.
  description: |
    Read-only endpoints: the list of approved institutions a user can sign
    in through, with the IdP each one steers to, and the JSON-LD contexts
    that map that list to schema.org. The list also answers CORS preflight
    requests.

    The list comes in an envelope, `{ type, status, message, version, result }`.

    ### Versions
    `v1` in the paths is the API's major version, which changes only with an
    incompatible change. `info.version` versions this document and stays
    below 1.0.0 until the v1 contract is frozen: until then a minor version
    may still change it incompatibly. From 1.0.0 on, minor versions only add
    to it.

    ### Compatibility
    Later versions may add fields to any object. Clients must ignore
    fields they do not recognise.

    ### Linked data
    The payload stays plain JSON. Each schema and field names the
    linked-data term it means with `x-schema-org`, and the JSON-LD context
    holds the same mapping. `schema-org.md`, next to this document, explains
    the choice of terms.

    ### Errors
    Errors are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
    details (`application/problem+json`, the `Problem` schema), sent with
    `Cache-Control: no-store`. Besides the errors each operation lists:

    - A method a path does not support gets `405 Method Not Allowed`, with
      an `Allow` header naming the methods it does support:
      `GET, HEAD, OPTIONS` for `/api/v1/institutions`, `GET, HEAD` for a
      context.
    - Any other path under `/api/v1` gets `404 Not Found`.

    On `/api/v1/institutions` these errors carry the list's CORS headers,
    like every response there. Everywhere else they carry
    `Access-Control-Allow-Origin: *`, like the contexts.
  contact:
    name: TACC
    url: https://tacc.utexas.edu
  license:
    name: Proprietary

servers:
  - url: "{base_url}"
    description: Any deployment of this API.
    variables:
      base_url:
        default: https://tms.example.org
        description: Base URL of the deployment, with no trailing slash.

# Public: the list holds no secrets, and the login page reads it before sign-in.
security:
  - {}

tags:
  - name: institutions
    description: Approved-institution registry

paths:
  /api/v1/institutions:
    get:
      tags: [institutions]
      operationId: listInstitutions
      summary: List the approved institutions with their IdP data
      description: |
        Returns approved entries only, in registry order. The list is public,
        so unapproved entries (for example, ones pending review) never appear
        in it.

        **Caching.** Clients revalidate on every use (`Cache-Control: no-cache`).
        When the data has a `version`, the response's `ETag` is the weak tag
        `W/"<version>"`. It is weak because `version` names a revision of the
        data, not the exact bytes: the same data may be sent with other bytes
        (field order, white space, a reworded `message`).

        **Conditional requests.** `If-None-Match` matches when it is `*`, or
        when one of its comma-separated entity tags equals the current `ETag`
        by weak comparison: the `W/` prefix is ignored on both sides and the
        quoted parts are compared byte for byte. `*` matches whenever the list
        can be served, whether or not the data has a `version`. A tag that
        cannot be parsed matches nothing. A match gets `304 Not Modified` with
        no body and the headers a `200` would carry, except `Link`. When the
        registry cannot be read, the error is sent whatever `If-None-Match`
        holds.

        **CORS.** Cross-origin reads are set per deployment by a list of
        allowed origins (`scheme://host[:port]`), which is either empty,
        specific origins, or `*` for any origin. Every response, including
        `304` and errors, follows it:

        - **Empty** (only clients on the same origin): no CORS headers.
        - **Specific origins**: always `Vary: Origin`. When the request's
          `Origin` exactly matches a listed origin, also
          `Access-Control-Allow-Origin` set to that origin and
          `Access-Control-Expose-Headers: ETag, Link`. Other origins get no
          `Access-Control-*` headers.
        - **`*`**: `Access-Control-Allow-Origin: *` and
          `Access-Control-Expose-Headers: ETag, Link` on every response.

        The list is public, so credentials are never allowed
        (`Access-Control-Allow-Credentials` is never sent). A cross-origin
        `GET` that sets `If-None-Match` itself is preceded by a preflight,
        which `OPTIONS` answers.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: Entity tags from earlier responses, or `*`.
          schema:
            type: string
          example: W/"2026-10-23.1"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: The approved institutions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
            Link:
              description: |
                Points JSON-LD processors at the latest context, as an absolute URL:
                `<{base_url}/api/v1/institutions.context.r2.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"`.
              required: true
              schema:
                type: string
              example: <https://tms.example.org/api/v1/institutions.context.r2.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionsResponse"
              examples:
                approved:
                  summary: An abridged list
                  value:
                    type: ItemList
                    status: success
                    message: Approved institutions.
                    version: "2026-10-23.1"
                    result:
                      - type: Organization
                        id: globus
                        name: Globus (default login, no redirect)
                        provider: globus
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
                      - type: Organization
                        id: uchicago
                        name: University of Chicago
                        provider: globus
                        redirect_idp_domain: uchicago.edu
                        idp_logout_url: https://uchicago.okta.com/login/signout
                        approved: true
                      - type: Organization
                        id: tacc_tapis
                        name: Tapis OAuth2 (TaccTapis)
                        provider: tacc_tapis
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
        "304":
          description: |
            `If-None-Match` matched (see above). No body, and no `Link`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
        "500":
          $ref: "#/components/responses/RegistryInvalid"
        "503":
          $ref: "#/components/responses/RegistryUnavailable"
    options:
      tags: [institutions]
      operationId: preflightInstitutions
      summary: CORS preflight for the institutions list
      description: |
        Answers the preflight a browser sends before a cross-origin `GET`
        that sets `If-None-Match`, by the same list of allowed origins as
        `GET`:

        - **Empty**: no CORS headers, so the browser blocks the `GET`.
        - **Specific origins**: always `Vary: Origin`. A listed `Origin` also
          gets `Access-Control-Allow-Origin` set to that origin and the
          `Access-Control-Allow-*` and `Access-Control-Max-Age` headers
          below; other origins get no `Access-Control-*` headers.
        - **`*`**: `Access-Control-Allow-Origin: *` and the headers below.

        The allowed method and header are fixed. The server need not check
        `Access-Control-Request-Method` or `Access-Control-Request-Headers`:
        the browser compares them against what the response allows.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: Access-Control-Request-Method
          in: header
          required: false
          description: Method of the request being preflighted.
          schema:
            type: string
          example: GET
        - name: Access-Control-Request-Headers
          in: header
          required: false
          description: Non-safelisted headers the request will set.
          schema:
            type: string
          example: if-none-match
      responses:
        "204":
          description: The preflight answer; no body.
          headers:
            Allow:
              description: Methods the list supports.
              required: true
              schema:
                const: GET, HEAD, OPTIONS
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Allow-Methods:
              description: Sent exactly when `Access-Control-Allow-Origin` is.
              schema:
                const: GET
            Access-Control-Allow-Headers:
              description: Sent exactly when `Access-Control-Allow-Origin` is.
              schema:
                const: If-None-Match
            Access-Control-Max-Age:
              description: |
                Seconds the browser may reuse this answer. Sent exactly when
                `Access-Control-Allow-Origin` is.
              schema:
                const: 7200
            Vary:
              $ref: "#/components/headers/VaryOrigin"

  /api/v1/institutions.context.r{revision}.jsonld:
    get:
      tags: [institutions]
      operationId: getInstitutionsContext
      summary: A revision of the JSON-LD context for the institutions list
      description: |
        Maps the list's plain JSON fields to schema.org and `tms:` terms.
        Public and open to any origin (`Access-Control-Allow-Origin: *`), so
        JSON-LD processors on other sites can fetch it.

        Contexts are revised separately from the API. Each revision is one
        fixed document: a changed context (for example, mapping a field a
        later version adds) is published as the next revision, and the
        list's `Link` header moves to it. Earlier revisions stay served
        unchanged for clients that cached a `Link` to them. A revision's URL
        never changes content, so it may be cached indefinitely.

        The files `institutions.context.r<n>.jsonld` next to this document
        are the authoritative content of each revision; the example below
        is the latest one.
      parameters:
        - name: revision
          in: path
          required: true
          description: |
            A published revision, in decimal without leading zeros. Any
            other value gets `404`.
          schema:
            type: integer
            enum: [1, 2]
          example: 2
      responses:
        "200":
          description: The JSON-LD context document.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
            Cache-Control:
              required: true
              schema:
                const: public, max-age=31536000, immutable
          content:
            application/ld+json:
              schema:
                type: object
                required: ["@context"]
                properties:
                  "@context":
                    type: object
              examples:
                latest:
                  summary: Revision 2
                  value:
                    "@context":
                      schema: https://schema.org/
                      tms: https://tacc.utexas.edu/ns/tms#
                      type: "@type"
                      ItemList: schema:ItemList
                      Organization: schema:Organization
                      status: null
                      message: null
                      version: null
                      result: schema:itemListElement
                      id: schema:identifier
                      name: schema:name
                      provider:
                        "@id": tms:provider
                        "@type": "@vocab"
                      redirect_idp_domain: tms:redirectIdpDomain
                      idp_logout_url:
                        "@id": tms:idpLogoutUrl
                        "@type": "@id"
                      approved: tms:approved
                      globus: tms:GlobusProvider
                      tacc_tapis: tms:TaccTapisProvider
        "404":
          description: No such revision has been published.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
            Cache-Control:
              $ref: "#/components/headers/ErrorCacheControl"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unknown:
                  summary: An unpublished revision
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: No such resource.

components:
  parameters:
    Origin:
      name: Origin
      in: header
      required: false
      description: Origin of the page making a cross-origin request.
      schema:
        type: string
      example: https://portal.example.org

  headers:
    ListCacheControl:
      description: Clients must revalidate before reusing a stored copy.
      required: true
      schema:
        const: no-cache
    ErrorCacheControl:
      description: Errors are never stored.
      required: true
      schema:
        const: no-store
    ETag:
      description: |
        The weak tag `W/"<version>"`. Present exactly when the data has a
        `version`.
      schema:
        type: string
        pattern: '^W/"[-!#-+.-~]{1,64}"$'
      example: W/"2026-10-23.1"
    CorsAllowOrigin:
      description: |
        The request's `Origin` when the deployment allows it, or `*` when it
        allows any origin. Absent otherwise.
      schema:
        type: string
      example: https://portal.example.org
    CorsExposeHeaders:
      description: |
        Lets cross-origin scripts read the `ETag` and `Link` headers. Sent
        exactly when `Access-Control-Allow-Origin` is.
      schema:
        const: ETag, Link
    VaryOrigin:
      description: |
        Sent when the deployment allows specific origins, since the CORS
        headers then depend on the request's `Origin`.
      schema:
        const: Origin
    AnyOrigin:
      description: Any origin may read the response.
      required: true
      schema:
        const: "*"

  responses:
    RegistryInvalid:
      description: |
        The registry was read but is invalid, so none of it is served.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/CorsAllowOrigin"
        Access-Control-Expose-Headers:
          $ref: "#/components/headers/CorsExposeHeaders"
        Vary:
          $ref: "#/components/headers/VaryOrigin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              summary: An invalid registry
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: The institution registry is invalid.
    RegistryUnavailable:
      description: |
        The registry could not be read for now; the client may retry later.
        `Retry-After`, when sent, says how long to wait.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/CorsAllowOrigin"
        Access-Control-Expose-Headers:
          $ref: "#/components/headers/CorsExposeHeaders"
        Vary:
          $ref: "#/components/headers/VaryOrigin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              summary: An unreachable registry
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The institution registry cannot be read right now.

  schemas:
    InstitutionsResponse:
      type: object
      description: |
        Envelope around the institution list. Clients must ignore fields
        they do not recognise.
      x-schema-org:
        "@type": schema:ItemList
      required: [type, status, message, result]
      properties:
        type:
          const: ItemList
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        status:
          const: success
        message:
          type: string
          description: Human-readable summary of the response.
        version:
          type: string
          description: |
            Revision of the institution data (not of this API), so a client can
            tell when the list has changed. Opaque; it is also the inside of
            the response's `ETag`, so it is limited to visible ASCII other than
            `"` (not allowed in an `ETag`) and `,` (which separates tags in
            `If-None-Match`). Optional; readers must not require it.
          minLength: 1
          maxLength: 64
          pattern: "^[-!#-+.-~]+$"
          examples: ["2026-10-23.1"]
        result:
          type: array
          description: |
            The approved institutions, in registry order. Each `id` appears
            at most once; the server must enforce this, since JSON Schema
            cannot.
          items:
            $ref: "#/components/schemas/Institution"
          x-schema-org: schema:itemListElement

    Institution:
      type: object
      x-schema-org:
        "@type": schema:Organization
      description: |
        An organization users can sign in through. Responses always include
        every field, writing `null` where a field does not apply. Clients must
        ignore fields they do not recognise.
      required: [type, id, name, provider, redirect_idp_domain, idp_logout_url, approved]
      # A tacc_tapis entry never has an IdP domain.
      if:
        properties:
          provider:
            const: tacc_tapis
      then:
        properties:
          redirect_idp_domain:
            type: "null"
      properties:
        type:
          const: Organization
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        id:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9_]+$"
          description: Stable identifier of the entry, unique within the list.
          examples: [uchicago]
          x-schema-org: schema:identifier
        name:
          type: string
          minLength: 1
          maxLength: 256
          # At least one character that is not white space.
          pattern: '\S'
          description: Display name.
          examples: [University of Chicago]
          x-schema-org: schema:name
        provider:
          $ref: "#/components/schemas/Provider"
        redirect_idp_domain:
          type: [string, "null"]
          format: hostname
          maxLength: 253
          # Two or more dot-separated labels of lower-case letters, digits and
          # inner hyphens, each 1-63 characters. The last (top-level) label
          # starts with a letter, which rules out IP addresses.
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            Domain Globus associates with the institution's IdP, in lower case.
            `null` when the entry has no IdP to steer to, and always `null`
            when `provider` is `tacc_tapis`.
          examples: [uchicago.edu]
          x-schema-org: tms:redirectIdpDomain
        idp_logout_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          # https, a non-empty host, and no white space anywhere.
          pattern: '^https://[^/?#\s]+([/?#]\S*)?$'
          description: |
            Sign-out URL of the institution's own IdP, always `https`, or
            `null` when there is none.
          examples: [https://uchicago.okta.com/login/signout]
          x-schema-org: tms:idpLogoutUrl
        approved:
          const: true
          description: |
            Whether login may proceed for this institution. Always `true`,
            since the listing leaves unapproved entries out.
          x-schema-org: tms:approved

    Provider:
      type: string
      enum: [globus, tacc_tapis]
      description: |
        Login flow for the entry.
        `globus`: Globus Auth, optionally steered by `redirect_idp_domain`.
        `tacc_tapis`: Tapis OAuth2, without Globus.
      x-schema-org: tms:provider

    Problem:
      type: object
      description: |
        [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem details.
        `type` is `about:blank`, so `title` is the HTTP status phrase and
        `detail` says what went wrong. Clients must ignore members they do
        not recognise.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type; `about:blank` until a version defines others.
          examples: [about:blank]
        title:
          type: string
          minLength: 1
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The response's HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence.
