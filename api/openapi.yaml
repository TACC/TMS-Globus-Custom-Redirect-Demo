openapi: 3.1.0
info:
  title: Approved Institutions API
  version: 0.9.0
  summary: The institutions a user can sign in through, and the IdP each one steers to.
  description: |
    One read-only endpoint: the list of approved institutions a user can
    sign in through, with the IdP each one steers to.

    The list comes in an envelope, `{ status, message, data_version, result }`.
    Its entries come from the deployment's institution data: every entry
    an operator has approved for sign-in, and no other.

    This document is the core of the API, and all an implementation must
    serve. `openapi.addendum.yaml`, next to it, is optional: cross-origin
    reads (CORS) and a JSON-LD view of the list.

    ### Versions
    `v1` in the paths is the API's major version, which changes only with an
    incompatible change. The paths follow tms_server's layout, `/v1/tms/...`.
    `info.version` versions this document and stays below 1.0.0 until the
    v1 contract is frozen: until then a minor version may still change it
    incompatibly. From 1.0.0 on, minor versions only add to it.

    ### Compatibility
    Later versions may add fields to any object, and values to `provider`
    (see `Provider`). Clients must ignore fields they do not recognise.

    ### Requests
    - Query parameters are ignored.
    - `Accept` is ignored: the list is always `application/json`, never `406`.
    - Generic HTTP behaviour (`HEAD`, `If-Match`, `405` for other methods)
      follows RFC 9110 and is not restated here.

    ### Conditional requests
    `If-None-Match` is `*`, or a comma-separated list of entity tags. `*`
    matches whenever the list can be served; it is valid only as the whole
    field. A tag matches when it equals the response's `ETag` by weak
    comparison (RFC 9110 §8.8.3.2). A match gets `304 Not Modified`.
    `If-None-Match` is evaluated only once the data can be read: when it
    cannot, the error is sent whatever it says.

    ### Header values
    A header whose value is a comma-separated list (`Cache-Control` here)
    is given as a string, with `x-required-members` naming the members it
    carries at least; they may come in any order, and a deployment may add
    others that do not contradict them. Its `example` is the value without
    additions. A header with a single exact value is given as a `const`.
    Responses may carry headers this document does not mention.

    Every response carries `X-Content-Type-Options: nosniff`.

    ### Errors
    Errors are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
    details (`application/problem+json`, the `Problem` schema), sent with
    `Cache-Control: no-store`.
  contact:
    name: TACC
    url: https://tacc.utexas.edu
  license:
    name: GNU General Public License v3.0 only
    identifier: GPL-3.0-only

servers:
  - url: "{base_url}"
    description: Any deployment of this API.
    variables:
      base_url:
        default: https://tms.example.org
        description: Base URL of the deployment, with no trailing slash.

# Public: the list holds no secrets, and clients read it before sign-in.
security:
  - {}

tags:
  - name: institutions
    description: Approved-institution list

paths:
  /v1/tms/institutions:
    get:
      tags: [institutions]
      operationId: listInstitutions
      summary: List the approved institutions with their IdP data
      description: |
        Returns approved entries only, in a stable order the server
        chooses: the same on every request while `data_version` stays the
        same. The list is public, so unapproved entries (for example, ones
        pending review) never appear in it.

        **Caching.** Clients revalidate on every use (`Cache-Control: no-cache`).
        When the data has a `data_version`, the response has a weak `ETag`
        that changes whenever `data_version` does. It is weak because it
        names a revision of the data, not the exact bytes: the same data may
        be sent with other bytes (field order, white space, a reworded
        `message`). See *Conditional requests* above.

        A `304` carries `Cache-Control` and `ETag`, as a `200` would, and no
        body or `Content-Type`.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The approved institutions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionsResponse"
              examples:
                approved:
                  summary: An abridged list
                  value:
                    status: success
                    message: Approved institutions.
                    data_version: "2026-10-23.1"
                    result:
                      - id: globus
                        name: Globus (default login, no redirect)
                        provider: globus
                        redirect_idp_domain: null
                        idp_logout_url: null
                      - id: uchicago
                        name: University of Chicago
                        provider: globus
                        redirect_idp_domain: uchicago.edu
                        idp_logout_url: https://uchicago.okta.com/login/signout
                      - id: tacc_tapis
                        name: Tapis OAuth2 (TaccTapis)
                        provider: tacc_tapis
                        redirect_idp_domain: null
                        idp_logout_url: null
        "304":
          $ref: "#/components/responses/ListNotModified"
        "500":
          $ref: "#/components/responses/DataInvalid"
        "503":
          $ref: "#/components/responses/DataUnavailable"

components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Entity tags from earlier responses, or `*`.
      schema:
        type: string
      example: W/"2026-10-23.1"

  headers:
    ListCacheControl:
      description: Clients must revalidate before reusing a stored copy.
      required: true
      schema:
        type: string
      example: no-cache
      x-required-members: [no-cache]
    ErrorCacheControl:
      description: Errors are never stored.
      required: true
      schema:
        type: string
      example: no-store
      x-required-members: [no-store]
    ETag:
      description: |
        A weak entity tag, present exactly when the data has a
        `data_version`, and changed whenever `data_version` changes.
        Otherwise opaque: clients must not parse it.
      schema:
        type: string
        pattern: '^W/"[!#-~]{1,128}"$'
      example: W/"2026-10-23.1"
    RetryAfter:
      description: Seconds to wait before retrying. Optional.
      schema:
        type: integer
        minimum: 0
    NoSniff:
      description: Browsers must not guess another media type for the body.
      required: true
      schema:
        const: nosniff

  responses:
    ListNotModified:
      description: |
        `If-None-Match` matched. No body or `Content-Type`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ListCacheControl"
        ETag:
          $ref: "#/components/headers/ETag"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
    DataInvalid:
      description: |
        The institution data was read but is invalid, so none of it is
        served.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              summary: Invalid institution data
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: The institution data is invalid.
    DataUnavailable:
      description: |
        The institution data could not be read for now; the client may
        retry later.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        Cache-Control:
          $ref: "#/components/headers/ErrorCacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              summary: Unreachable institution data
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The institution data cannot be read right now.

  schemas:
    InstitutionsResponse:
      type: object
      description: |
        Envelope around the institution list. Clients must ignore fields
        they do not recognise.
      required: [status, message, result]
      properties:
        status:
          const: success
        message:
          type: string
          description: Human-readable summary of the response.
        data_version:
          type: string
          description: |
            Revision of the institution data (not of this API), so a client can
            tell when the list has changed. The server MUST give the data a
            new `data_version` whenever anything in `result` changes. Opaque;
            limited to visible ASCII other than `"` and `,`, so a server can
            put it inside a quoted `ETag` that `If-None-Match` lists keep
            whole. Optional; readers must not require it.
          minLength: 1
          maxLength: 64
          pattern: "^[-!#-+.-~]+$"
          examples: ["2026-10-23.1"]
        result:
          type: array
          description: |
            The approved institutions, in the server's stable order. Each
            `id` appears at most once; the server must enforce this, since
            JSON Schema cannot.
          items:
            $ref: "#/components/schemas/Institution"

    Institution:
      type: object
      description: |
        An organization users can sign in through. Responses always include
        every field, writing `null` where a field does not apply. Clients must
        ignore fields they do not recognise.
      required: [id, name, provider, redirect_idp_domain, idp_logout_url]
      # A tacc_tapis entry never has an IdP domain.
      if:
        properties:
          provider:
            const: tacc_tapis
      then:
        properties:
          redirect_idp_domain:
            type: "null"
      properties:
        id:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9_]+$"
          description: Stable identifier of the entry, unique within the list.
          examples: [uchicago]
        name:
          type: string
          minLength: 1
          maxLength: 256
          # At least one character that is not white space.
          pattern: '\S'
          description: Display name.
          examples: [University of Chicago]
        provider:
          $ref: "#/components/schemas/Provider"
        redirect_idp_domain:
          type: [string, "null"]
          format: hostname
          maxLength: 253
          # Two or more dot-separated labels of lower-case letters, digits and
          # inner hyphens, each 1-63 characters. The last (top-level) label
          # starts with a letter, which rules out IP addresses.
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            Domain Globus associates with the institution's IdP, in lower case.
            `null` when the entry has no IdP to steer to, and always `null`
            when `provider` is `tacc_tapis`.
          examples: [uchicago.edu]
        idp_logout_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          # https, a non-empty host, and no white space anywhere.
          pattern: '^https://[^/?#\s]+([/?#]\S*)?$'
          description: |
            Sign-out URL of the institution's own IdP, always `https`, or
            `null` when there is none.
          examples: [https://uchicago.okta.com/login/signout]

    Provider:
      type: string
      pattern: "^[a-z0-9_]+$"
      maxLength: 64
      description: |
        Login flow for the entry. An open set of values: this version sends
        the known values below, and a later minor version may add one.
        Clients must not reject a response for an unknown value; they skip
        the entries whose provider they do not support.

        - `globus`: Globus Auth, optionally steered by `redirect_idp_domain`.
        - `tacc_tapis`: Tapis OAuth2, without Globus.
      x-known-values: [globus, tacc_tapis]
      examples: [globus, tacc_tapis]

    Problem:
      type: object
      description: |
        [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem details.
        `type` is `about:blank`, so `title` is the HTTP status phrase and
        `detail` says what went wrong. Clients must ignore members they do
        not recognise.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type; `about:blank` until a version defines others.
          examples: [about:blank]
        title:
          type: string
          minLength: 1
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The response's HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence.
