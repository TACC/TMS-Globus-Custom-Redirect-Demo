openapi: 3.1.0
info:
  title: Approved Institutions API
  version: 0.3.0
  summary: The institutions a user can sign in through, and the IdP each one steers to.
  description: |
    One read-only endpoint listing the approved institutions a user can sign
    in through, and the IdP each one steers to.

    Responses use the Tapis-style envelope `{ status, message, version, result }`.

    ### schema.org mapping
    The payload stays plain, flat JSON. Each schema and field names the
    linked-data term it means with `x-schema-org`; the JSON-LD context served at
    `GET /api/institutions.context.jsonld` holds the same mapping.

    - The response is a [schema:ItemList](https://schema.org/ItemList) and each
      entry a [schema:Organization](https://schema.org/Organization). The
      `type` fields carry those types into the graph; a context cannot add
      them on its own.
    - The list links each entry directly with `schema:itemListElement`. The
      order of `result` is part of the JSON only; the graph does not record it.
    - Fields with no schema.org term (IdP domain, IdP sign-out URL, approval,
      login provider) use the `tms:` vocabulary (`https://tacc.utexas.edu/ns/tms#`).
    - The envelope fields `status`, `message` and `version` describe the HTTP
      response, not the institutions, so the context leaves them out of the graph.

    `x-schema-org-related` names the schema.org terms closest in meaning,
    including ones from [pending.schema.org](https://pending.schema.org/docs/pending.home.html).
    They need nested objects (an action, a certification) that a flat field
    cannot express, so they document intent rather than map the field:

    - **AuthenticateAction** (pending, issue 4507): signing in to the
      institution's IdP. `provider` and `redirect_idp_domain` describe it.
    - **Certification** / **certificationStatus** (core): `approved` amounts to
      a Certification with status `CertificationActive` or `CertificationInactive`.

    schema.org, pending included, has no term for an IdP domain or a sign-out
    URL, so those stay in `tms:`.

    ### Compatibility
    Later minor versions may add fields to any object. Clients must ignore
    fields they do not recognise.
  license:
    name: Proprietary
externalDocs:
  description: schema.org pending terms
  url: https://pending.schema.org/docs/pending.home.html

servers:
  - url: "{base_url}"
    description: Any deployment of this API.
    variables:
      base_url:
        default: https://tms.example.org
        description: Base URL of the deployment, with no trailing slash.

# Public: the list holds no secrets, and the login page reads it before sign-in.
security:
  - {}

tags:
  - name: institutions
    description: Approved-institution registry

paths:
  /login/institutions:
    get:
      tags: [institutions]
      operationId: listInstitutions
      summary: List the approved institutions with their IdP data
      description: |
        Returns approved entries only, in registry order. The list is public,
        so unapproved entries (for example, ones pending review) never appear
        in it.

        It is meant for the login page on the same origin, so it sends no
        CORS headers. Clients revalidate on every use (`Cache-Control: no-cache`);
        when the data has a `version`, it doubles as the `ETag`, and a matching
        `If-None-Match` gets `304 Not Modified`.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: An `ETag` from an earlier response.
          schema:
            type: string
          example: '"2026-10-23.1"'
      responses:
        "200":
          description: The approved institutions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Link:
              description: |
                Points JSON-LD processors at the context served by
                `GET /api/institutions.context.jsonld`, as an absolute URL:
                `<{base_url}/api/institutions.context.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"`.
              required: true
              schema:
                type: string
              example: <https://tms.example.org/api/institutions.context.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionsResponse"
              examples:
                approved:
                  summary: An abridged list
                  value:
                    type: ItemList
                    status: success
                    message: Approved institutions.
                    version: "2026-10-23.1"
                    result:
                      - type: Organization
                        id: globus
                        name: Globus (default login, no redirect)
                        provider: globus
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
                      - type: Organization
                        id: uchicago
                        name: University of Chicago
                        provider: globus
                        redirect_idp_domain: uchicago.edu
                        idp_logout_url: https://uchicago.okta.com/login/signout
                        approved: true
                      - type: Organization
                        id: tacc_tapis
                        name: Tapis OAuth2 (TaccTapis)
                        provider: tacc_tapis
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
        "304":
          description: The list has not changed since the `ETag` in `If-None-Match`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
        "500":
          description: The registry could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/institutions.context.jsonld:
    get:
      tags: [institutions]
      operationId: getInstitutionsContext
      summary: The JSON-LD context for the institutions list
      description: |
        Maps the list's plain JSON fields to schema.org and `tms:` terms.
        Public and open to any origin (`Access-Control-Allow-Origin: *`), so
        JSON-LD processors on other sites can fetch it. It changes only with
        this API's version, so it may be cached for a day.
      responses:
        "200":
          description: The JSON-LD context document.
          headers:
            Access-Control-Allow-Origin:
              required: true
              schema:
                const: "*"
            Cache-Control:
              required: true
              schema:
                const: public, max-age=86400
          content:
            application/ld+json:
              schema:
                type: object
                required: ["@context"]
                properties:
                  "@context":
                    type: object

components:
  headers:
    ListCacheControl:
      description: Clients must revalidate before reusing a stored copy.
      required: true
      schema:
        const: no-cache
    ETag:
      description: |
        The response's `version` in double quotes. Present exactly when
        `version` is.
      schema:
        type: string
        pattern: '^"[!#-~]{1,64}"$'
      example: '"2026-10-23.1"'

  schemas:
    InstitutionsResponse:
      type: object
      description: |
        Tapis-style envelope around the institution list. Clients must ignore
        fields they do not recognise.
      x-schema-org:
        "@type": schema:ItemList
      required: [type, status, message, result]
      properties:
        type:
          const: ItemList
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        status:
          const: success
        message:
          type: string
          description: Human-readable summary of the response.
        version:
          type: string
          description: |
            Revision of the institution data (not of this API), so a client can
            tell when the list has changed. Opaque; it is also the response's
            `ETag`, so it is limited to characters an `ETag` allows. Optional;
            readers must not require it.
          minLength: 1
          maxLength: 64
          pattern: "^[!#-~]+$"
          examples: ["2026-10-23.1"]
        result:
          type: array
          description: |
            The approved institutions, in registry order. Each `id` appears
            at most once; the server must enforce this, since JSON Schema
            cannot.
          items:
            $ref: "#/components/schemas/Institution"
          x-schema-org: schema:itemListElement

    ErrorResponse:
      type: object
      required: [status, message, result]
      properties:
        status:
          const: error
        message:
          type: string
        result:
          type: "null"

    Institution:
      type: object
      x-schema-org:
        "@type": schema:Organization
      description: |
        An organization users can sign in through. Responses always include
        every field, writing `null` where a field does not apply. Clients must
        ignore fields they do not recognise.
      required: [type, id, name, provider, redirect_idp_domain, idp_logout_url, approved]
      # Tapis logins do not go through Globus, so there is no IdP to steer to.
      if:
        properties:
          provider:
            const: tacc_tapis
      then:
        properties:
          redirect_idp_domain:
            type: "null"
      properties:
        type:
          const: Organization
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        id:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9_]+$"
          description: Stable id the UI uses to pick the institution at login.
          examples: [uchicago]
          x-schema-org: schema:identifier
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Display name.
          examples: [University of Chicago]
          x-schema-org: schema:name
        provider:
          $ref: "#/components/schemas/Provider"
        redirect_idp_domain:
          type: [string, "null"]
          format: hostname
          maxLength: 253
          # Two or more dot-separated labels of lower-case letters, digits and
          # inner hyphens, each 1-63 characters.
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            Domain Globus associates with the institution's IdP, in lower case,
            passed verbatim as `redirect_idp_domain` on the authorize request.
            Login also requires the returned username to end in `@<domain>`.
            `null` means a plain login that accepts any identity, and is
            required when `provider` is `tacc_tapis`.
          examples: [uchicago.edu]
          x-schema-org: tms:redirectIdpDomain
          x-schema-org-related: [schema:AuthenticateAction]
        idp_logout_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            Sign-out URL of the institution's own IdP. Globus does not pass
            `prompt=login` on to the IdP, so ending the IdP's session is the
            only way to make the next login ask for a password again.
            Clients redirect the browser here at sign-out, so it must be `https`.
          examples: [https://uchicago.okta.com/login/signout]
          x-schema-org: tms:idpLogoutUrl
        approved:
          const: true
          description: |
            Whether login may proceed for this institution. Always `true`,
            since the listing leaves unapproved entries out.
          x-schema-org: tms:approved
          x-schema-org-related: [schema:Certification, schema:certificationStatus]

    Provider:
      type: string
      enum: [globus, tacc_tapis]
      description: |
        Login flow for the entry, named after tms_portal's provider types.
        `globus`: Globus Auth, optionally steered by `redirect_idp_domain`.
        `tacc_tapis`: Tapis OAuth2 directly, not through Globus.
      x-schema-org: tms:provider
      x-schema-org-related: [schema:AuthenticateAction, schema:provider]
