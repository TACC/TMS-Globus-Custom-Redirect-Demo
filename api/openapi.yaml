openapi: 3.1.0
info:
  title: Approved Institutions API
  version: 0.5.0
  summary: The institutions a user can sign in through, and the IdP each one steers to.
  description: |
    Two read-only endpoints: the list of approved institutions a user can
    sign in through, with the IdP each one steers to, and the JSON-LD context
    that maps that list to schema.org. The list also answers CORS preflight
    requests.

    The list uses the Tapis-style envelope `{ type, status, message, version, result }`.

    ### schema.org mapping
    The payload stays plain, flat JSON. Each schema and field names the
    linked-data term it means with `x-schema-org`; the JSON-LD context served at
    `GET /api/v1/institutions.context.r1.jsonld` holds the same mapping.

    - The response is a [schema:ItemList](https://schema.org/ItemList) and each
      entry a [schema:Organization](https://schema.org/Organization). The
      `type` fields carry those types into the graph; a context cannot add
      them on its own.
    - The list links each entry directly with `schema:itemListElement`. The
      order of `result` is part of the JSON only; the graph does not record it.
    - Fields with no schema.org term (IdP domain, IdP sign-out URL, approval,
      login provider) use the `tms:` vocabulary (`https://tacc.utexas.edu/ns/tms#`).
    - The envelope fields `status`, `message` and `version` describe the HTTP
      response, not the institutions, so the context leaves them out of the graph.

    `x-schema-org-related` names the schema.org terms closest in meaning,
    including ones from [pending.schema.org](https://pending.schema.org/docs/pending.home.html).
    They need nested objects (an action, a certification) that a flat field
    cannot express, so they document intent rather than map the field:

    - **AuthenticateAction** (pending, issue 4507): signing in to the
      institution's IdP. `provider` and `redirect_idp_domain` describe it.
    - **Certification** / **certificationStatus** (core): `approved` amounts to
      a Certification with status `CertificationActive` or `CertificationInactive`.

    schema.org, pending included, has no term for an IdP domain or a sign-out
    URL, so those stay in `tms:`.

    ### Compatibility
    Later minor versions may add fields to any object. Clients must ignore
    fields they do not recognise.
  contact:
    name: TACC
    url: https://tacc.utexas.edu
  license:
    name: Proprietary
externalDocs:
  description: schema.org pending terms
  url: https://pending.schema.org/docs/pending.home.html

servers:
  - url: "{base_url}"
    description: Any deployment of this API.
    variables:
      base_url:
        default: https://tms.example.org
        description: Base URL of the deployment, with no trailing slash.

# Public: the list holds no secrets, and the login page reads it before sign-in.
security:
  - {}

tags:
  - name: institutions
    description: Approved-institution registry

paths:
  /api/v1/institutions:
    get:
      tags: [institutions]
      operationId: listInstitutions
      summary: List the approved institutions with their IdP data
      description: |
        Returns approved entries only, in registry order. The list is public,
        so unapproved entries (for example, ones pending review) never appear
        in it.

        Clients revalidate on every use (`Cache-Control: no-cache`); when the
        data has a `version`, it doubles as the `ETag`, and a matching
        `If-None-Match` gets `304 Not Modified`.

        Cross-origin reads are set per deployment by a list of allowed
        origins (`scheme://host[:port]`), which is either empty, specific
        origins, or `*` for any origin. Every response, including `304` and
        errors, follows it:

        - **Empty** (only clients on the same origin): no CORS headers.
        - **Specific origins**: always `Vary: Origin`. When the request's
          `Origin` exactly matches a listed origin, also
          `Access-Control-Allow-Origin` set to that origin and
          `Access-Control-Expose-Headers: ETag, Link`. Other origins get no
          `Access-Control-*` headers.
        - **`*`**: `Access-Control-Allow-Origin: *` and
          `Access-Control-Expose-Headers: ETag, Link` on every response.

        The list is public, so credentials are never allowed
        (`Access-Control-Allow-Credentials` is never sent). A cross-origin
        `GET` that sets `If-None-Match` itself is preceded by a preflight,
        which `OPTIONS` answers.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: An `ETag` from an earlier response.
          schema:
            type: string
          example: '"2026-10-23.1"'
      responses:
        "200":
          description: The approved institutions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
            Link:
              description: |
                Points JSON-LD processors at the context served by
                `GET /api/v1/institutions.context.r1.jsonld`, as an absolute URL:
                `<{base_url}/api/v1/institutions.context.r1.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"`.
              required: true
              schema:
                type: string
              example: <https://tms.example.org/api/v1/institutions.context.r1.jsonld>; rel="http://www.w3.org/ns/json-ld#context"; type="application/ld+json"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionsResponse"
              examples:
                approved:
                  summary: An abridged list
                  value:
                    type: ItemList
                    status: success
                    message: Approved institutions.
                    version: "2026-10-23.1"
                    result:
                      - type: Organization
                        id: globus
                        name: Globus (default login, no redirect)
                        provider: globus
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
                      - type: Organization
                        id: uchicago
                        name: University of Chicago
                        provider: globus
                        redirect_idp_domain: uchicago.edu
                        idp_logout_url: https://uchicago.okta.com/login/signout
                        approved: true
                      - type: Organization
                        id: tacc_tapis
                        name: Tapis OAuth2 (TaccTapis)
                        provider: tacc_tapis
                        redirect_idp_domain: null
                        idp_logout_url: null
                        approved: true
        "304":
          description: The list has not changed since the `ETag` in `If-None-Match`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/ListCacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
        "500":
          description: The registry could not be read.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Expose-Headers:
              $ref: "#/components/headers/CorsExposeHeaders"
            Vary:
              $ref: "#/components/headers/VaryOrigin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      tags: [institutions]
      operationId: preflightInstitutions
      summary: CORS preflight for the institutions list
      description: |
        Answers the preflight a browser sends before a cross-origin `GET`
        that sets `If-None-Match`, by the same list of allowed origins as
        `GET`:

        - **Empty**: no CORS headers, so the browser blocks the `GET`.
        - **Specific origins**: always `Vary: Origin`. A listed `Origin` also
          gets `Access-Control-Allow-Origin` set to that origin and the
          `Access-Control-Allow-*` and `Access-Control-Max-Age` headers
          below; other origins get no `Access-Control-*` headers.
        - **`*`**: `Access-Control-Allow-Origin: *` and the headers below.

        The allowed method and header are fixed. The server need not check
        `Access-Control-Request-Method` or `Access-Control-Request-Headers`:
        the browser compares them against what the response allows.
      parameters:
        - name: Origin
          in: header
          required: false
          description: Origin of the page making the cross-origin request.
          schema:
            type: string
          example: https://portal.example.org
        - name: Access-Control-Request-Method
          in: header
          required: false
          description: Method of the request being preflighted.
          schema:
            type: string
          example: GET
        - name: Access-Control-Request-Headers
          in: header
          required: false
          description: Non-safelisted headers the request will set.
          schema:
            type: string
          example: if-none-match
      responses:
        "204":
          description: The preflight answer; no body.
          headers:
            Allow:
              description: Methods the list supports.
              required: true
              schema:
                const: GET, HEAD, OPTIONS
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/CorsAllowOrigin"
            Access-Control-Allow-Methods:
              description: Sent exactly when `Access-Control-Allow-Origin` is.
              schema:
                const: GET
            Access-Control-Allow-Headers:
              description: Sent exactly when `Access-Control-Allow-Origin` is.
              schema:
                const: If-None-Match
            Access-Control-Max-Age:
              description: |
                Seconds the browser may reuse this answer. Sent exactly when
                `Access-Control-Allow-Origin` is.
              schema:
                const: 7200
            Vary:
              $ref: "#/components/headers/VaryOrigin"

  /api/v1/institutions.context.r1.jsonld:
    get:
      tags: [institutions]
      operationId: getInstitutionsContext
      summary: The JSON-LD context for the institutions list
      description: |
        Maps the list's plain JSON fields to schema.org and `tms:` terms.
        Public and open to any origin (`Access-Control-Allow-Origin: *`), so
        JSON-LD processors on other sites can fetch it.

        Contexts are revised separately from the API. `r<n>` in the path
        names revision `n`, one fixed document: a changed context (for
        example, mapping a field a later minor version adds) is published as
        the next revision, `/api/v1/institutions.context.r<n+1>.jsonld`, and
        the list's `Link` header moves to it. Earlier revisions stay served
        unchanged for clients that cached a `Link` to them. A URL never
        changes content, so it may be cached indefinitely.
      responses:
        "200":
          description: The JSON-LD context document.
          headers:
            Access-Control-Allow-Origin:
              required: true
              schema:
                const: "*"
            Cache-Control:
              required: true
              schema:
                const: public, max-age=31536000, immutable
          content:
            application/ld+json:
              schema:
                type: object
                required: ["@context"]
                properties:
                  "@context":
                    type: object

components:
  headers:
    ListCacheControl:
      description: Clients must revalidate before reusing a stored copy.
      required: true
      schema:
        const: no-cache
    ETag:
      description: |
        The response's `version` in double quotes. Present exactly when
        `version` is.
      schema:
        type: string
        pattern: '^"[-!#-+.-~]{1,64}"$'
      example: '"2026-10-23.1"'
    CorsAllowOrigin:
      description: |
        The request's `Origin` when the deployment allows it, or `*` when it
        allows any origin. Absent otherwise.
      schema:
        type: string
      example: https://portal.example.org
    CorsExposeHeaders:
      description: |
        Lets cross-origin scripts read the `ETag` and `Link` headers. Sent
        exactly when `Access-Control-Allow-Origin` is.
      schema:
        const: ETag, Link
    VaryOrigin:
      description: |
        Sent when the deployment allows specific origins, since the CORS
        headers then depend on the request's `Origin`.
      schema:
        const: Origin

  schemas:
    InstitutionsResponse:
      type: object
      description: |
        Tapis-style envelope around the institution list. Clients must ignore
        fields they do not recognise.
      x-schema-org:
        "@type": schema:ItemList
      required: [type, status, message, result]
      properties:
        type:
          const: ItemList
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        status:
          const: success
        message:
          type: string
          description: Human-readable summary of the response.
        version:
          type: string
          description: |
            Revision of the institution data (not of this API), so a client can
            tell when the list has changed. Opaque; it is also the response's
            `ETag`, so it is limited to visible ASCII other than `"` (not
            allowed in an `ETag`) and `,` (which separates tags in
            `If-None-Match`). Optional; readers must not require it.
          minLength: 1
          maxLength: 64
          pattern: "^[-!#-+.-~]+$"
          examples: ["2026-10-23.1"]
        result:
          type: array
          description: |
            The approved institutions, in registry order. Each `id` appears
            at most once; the server must enforce this, since JSON Schema
            cannot.
          items:
            $ref: "#/components/schemas/Institution"
          x-schema-org: schema:itemListElement

    ErrorResponse:
      type: object
      required: [status, message, result]
      properties:
        status:
          const: error
        message:
          type: string
        result:
          type: "null"

    Institution:
      type: object
      x-schema-org:
        "@type": schema:Organization
      description: |
        An organization users can sign in through. Responses always include
        every field, writing `null` where a field does not apply. Clients must
        ignore fields they do not recognise.
      required: [type, id, name, provider, redirect_idp_domain, idp_logout_url, approved]
      # Tapis logins do not go through Globus, so there is no IdP to steer to.
      if:
        properties:
          provider:
            const: tacc_tapis
      then:
        properties:
          redirect_idp_domain:
            type: "null"
      properties:
        type:
          const: Organization
          description: JSON-LD type (aliased to `@type`).
          x-schema-org: "@type"
        id:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9_]+$"
          description: Stable id the UI uses to pick the institution at login.
          examples: [uchicago]
          x-schema-org: schema:identifier
        name:
          type: string
          minLength: 1
          maxLength: 256
          # At least one character that is not white space.
          pattern: '\S'
          description: Display name.
          examples: [University of Chicago]
          x-schema-org: schema:name
        provider:
          $ref: "#/components/schemas/Provider"
        redirect_idp_domain:
          type: [string, "null"]
          format: hostname
          maxLength: 253
          # Two or more dot-separated labels of lower-case letters, digits and
          # inner hyphens, each 1-63 characters. The last (top-level) label
          # starts with a letter, which rules out IP addresses.
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            Domain Globus associates with the institution's IdP, in lower case,
            passed verbatim as `redirect_idp_domain` on the authorize request.
            Login also requires the returned username to end in `@<domain>`.
            `null` means a plain login that accepts any identity, and is
            required when `provider` is `tacc_tapis`.
          examples: [uchicago.edu]
          x-schema-org: tms:redirectIdpDomain
          x-schema-org-related: [schema:AuthenticateAction]
        idp_logout_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          # https, a non-empty host, and no white space anywhere.
          pattern: '^https://[^/?#\s]+([/?#]\S*)?$'
          description: |
            Sign-out URL of the institution's own IdP. Globus does not pass
            `prompt=login` on to the IdP, so ending the IdP's session is the
            only way to make the next login ask for a password again.
            Clients redirect the browser here at sign-out, so it must be `https`.
          examples: [https://uchicago.okta.com/login/signout]
          x-schema-org: tms:idpLogoutUrl
        approved:
          const: true
          description: |
            Whether login may proceed for this institution. Always `true`,
            since the listing leaves unapproved entries out.
          x-schema-org: tms:approved
          x-schema-org-related: [schema:Certification, schema:certificationStatus]

    Provider:
      type: string
      enum: [globus, tacc_tapis]
      description: |
        Login flow for the entry, named after tms_portal's provider types.
        `globus`: Globus Auth, optionally steered by `redirect_idp_domain`.
        `tacc_tapis`: Tapis OAuth2 directly, not through Globus.
      x-schema-org: tms:provider
      x-schema-org-related: [schema:AuthenticateAction, schema:provider]
