<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGW Institution Login Demo</title>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/app.css">
    <style>
        .auth-form { margin: 0; }
        [hidden] { display: none !important; }
    </style>
</head>

<body>

    <div class="logo-bar">
        <div class="logo">
            <div class="logo-mark">SGW</div>
            <div class="logo-text">Science Gateway</div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <a class="nav-btn" href="/">Home</a>
            <a class="nav-btn">About</a>
        </div>
        <a class="auth-btn" id="login-btn" href="/demo">Log in</a>
        <!-- /logout is a POST: it revokes the token, then sends you through Globus sign-out back here. -->
        <form class="auth-form" id="logout-form" action="/logout" method="post" hidden>
            <button class="auth-btn">Log Out</button>
        </form>
    </nav>

    <div class="main">
        <h1>Globus Institution Login Demo</h1>
        <div id="authenticated" hidden>
            <p>Logged in as: <span id="user"></span></p>
            <p>Institution: <b id="institution"></b></p>
            <!-- Hidden for now; remove this comment wrapper to bring the TMS link back.
            <p class="tms-link">
                <a class="tms-btn"
                    href="https://tms-auth-service.tacc.cloud/login?idp_id=globus_idp&redirect_uri=https://tms-auth-service.tacc.cloud/">Link
                    Resources via TMS</a>
            </p>
            -->
        </div>
        <div id="anonymous">
            <p>You are not authenticated.</p>
            <p>Please Log In</p>
        </div>
    </div>

    <div>
        <img class="content-image" width="800" height="480" alt="Built by science banner" src="/static/assets/built-by-science-banner.jpg">
    </div>
    <p class="image-caption">For Science!</p>

    <script>
        fetch('/login/status')
            .then(r => r.json())
            .then(({ result }) => {
                if (!result?.logged_in) return;
                const u = result.user;
                const details = [u.identity_provider_display_name, u.preferred_username].filter(Boolean).join(', ');
                document.getElementById('user').textContent = `${u.name ?? u.preferred_username} (${details})`;
                document.getElementById('institution').textContent = result.institution;
                document.getElementById('authenticated').hidden = false;
                document.getElementById('anonymous').hidden = true;
                const form = document.getElementById('logout-form');
                form.hidden = false;
                document.getElementById('login-btn').hidden = true;
                // Globus's sign-out page (and the IdP sign-out it continues to)
                // never returns by itself, so it gets its own tab while this one
                // revokes the token and comes back here. Without JS the form's
                // plain POST /logout still signs out in this tab.
                form.addEventListener('submit', e => {
                    e.preventDefault();
                    if (result.logout_url) window.open(result.logout_url, '_blank', 'noopener');
                    fetch('/logout?local=true', { method: 'POST' })
                        .finally(() => location.assign('/'));
                });
            })
            .catch(() => {}); // stay on the logged-out view
    </script>
</body>

</html>
