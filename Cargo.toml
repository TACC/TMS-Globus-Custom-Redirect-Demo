[package]
name = "idp_redirect_demo"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Minimal demo of Globus Auth redirect_idp_domain driven by an approved-institutions list"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
sha2 = "0.10"
tower-http = { version = "0.7.1", features = ["fs"] }

# RSA key generation is very slow unoptimized; keep debug builds usable.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[dev-dependencies]
jsonschema = "0.60.1"
serde_yaml = "0.9.34"
tower = { version = "0.5.3", features = ["util"] }
