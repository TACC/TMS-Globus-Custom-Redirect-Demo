name: Conformance (external deployment)

# Runs the black-box conformance suite against any deployment of
# api/openapi.yaml, not the demo; for one that serves the addendum
# (api/openapi.addendum.yaml), also its tests and the live JSON-LD check.
# Start it by hand from the Actions tab, or call it from the
# implementation's repository after a deploy, with nothing to copy:
#
#   jobs:
#     conformance:
#       uses: TACC/TMS-Globus-Custom-Redirect-Demo/.github/workflows/conformance-external.yml@<sha>
#       with:
#         base_url: https://tms.example.org
#         spec_repository: TACC/TMS-Globus-Custom-Redirect-Demo
#         spec_ref: <sha>
#       secrets: inherit
#
# spec_repository and spec_ref say where api/, conformance/ and scripts/
# come from (default: the repository running the workflow, at its commit);
# pin spec_ref to the same commit as the workflow.
#
# A gateway in front of the deployment may need credentials: put them in the
# CONFORMANCE_EXTRA_HEADERS secret as a JSON object, e.g.
# {"Authorization": "Bearer ..."}. They are sent with every request.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployment, with no trailing slash
        required: true
        type: string
      addendum:
        description: The deployment serves the CORS and linked-data addendum
        required: false
        default: false
        type: boolean
      cors:
        description: "With the addendum, the deployment's allowed origins: empty, *, or comma-separated origins"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      addendum:
        required: false
        default: false
        type: boolean
      cors:
        required: false
        default: ""
        type: string
      spec_repository:
        required: false
        default: ""
        type: string
      spec_ref:
        required: false
        default: ""
        type: string
    secrets:
      CONFORMANCE_EXTRA_HEADERS:
        required: false

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment); update both together.
jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.base_url }}
      API_ADDENDUM: ${{ inputs.addendum }}
      API_CORS: ${{ inputs.cors }}
      API_EXTRA_HEADERS: ${{ secrets.CONFORMANCE_EXTRA_HEADERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.spec_repository || github.repository }}
          ref: ${{ inputs.spec_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r conformance/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider conformance
      - if: inputs.addendum
        run: python scripts/check_jsonld.py --url "$API_BASE_URL"
