name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests plus the API contract tests (src/institutions_api.rs), which
  # check the endpoints' responses against api/openapi.yaml.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # The spec itself: valid OpenAPI, examples that match their schemas, and an
  # example response that the JSON-LD context turns into the promised RDF.
  api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2.60.0 lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyld==3.3.0 pyyaml==6.0.3
      - run: python scripts/check_jsonld.py
