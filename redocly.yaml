# Lint config for the spec and its addendum: `npx @redocly/cli@2.60.0 lint`
extends:
  - recommended

apis:
  institutions:
    root: api/openapi.yaml
  institutions-addendum:
    root: api/openapi.addendum.yaml

rules:
  # Objects are open (clients must ignore unknown fields), so examples are
  # checked that way too. Strict checking also misreads the Institution
  # schema's if/then as forbidding every field the `then` branch leaves out.
  no-invalid-media-type-examples:
    severity: error
    allowAdditionalProperties: true
