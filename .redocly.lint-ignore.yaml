# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
#
# operation-4xx-response stays on for the context path, whose revision a
# client can get wrong (404). The list takes no input a client can get
# wrong, so neither its GET nor its preflight has a 4xx.
api/openapi.yaml:
  operation-4xx-response:
    - '#/paths/~1v1~1tms~1institutions/get/responses'
api/openapi.addendum.yaml:
  operation-4xx-response:
    - '#/paths/~1v1~1tms~1institutions/get/responses'
    - '#/paths/~1v1~1tms~1institutions/options/responses'
